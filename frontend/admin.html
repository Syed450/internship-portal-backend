<!DOCTYPE html>
<html>

<head>

    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="admin.css">

</head>

<body>

    <div class="container">

        <h1>Add Internship</h1>

        <input
            type="text"
            id="title"
            placeholder="Job Title"
        >

        <input
            type="text"
            id="company"
            placeholder="Company Name"
        >

        <input
            type="text"
            id="location"
            placeholder="Location"
        >

        <input
            type="text"
            id="stipend"
            placeholder="Stipend"
        >

        <input
            type="text"
            id="apply_link"
            placeholder="Apply Link"
        >

        <button onclick="addInternship()">

            Add Internship

        </button>

    </div>

    <script src="admin.js"></script>

</body>

</html>
