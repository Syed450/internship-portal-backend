<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Internship Portal - Login
    </title>

    <link
        rel="stylesheet"
        href="login.css"
    >

</head>

<body>

    <div class="container">

        <div class="login-box">

            <h1>
                Internship Portal
            </h1>

            <h2>
                Login
            </h2>

            <input
                type="email"
                id="email"
                placeholder="Enter Email"
            >

            <input
                type="password"
                id="password"
                placeholder="Enter Password"
            >

            <button onclick="login()">
                Login
            </button>

            <p id="message"></p>

            <p>

                Don't have an account?

                <a href="register.html">

                    Register

                </a>

            </p>

        </div>

    </div>

    <script src="login.js"></script>

</body>

</html>
